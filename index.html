<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Homenagem Dia das Mães</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        /* Cole aqui todo o conteúdo do seu App.css */
        @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@300;600&display=swap');
        :root { --cor-fundo: #fff5f5; --cor-texto: #4a4a4a; --cor-destaque: #ff85a2; }
        body { margin: 0; background-color: var(--cor-fundo); font-family: 'Poppins', sans-serif; color: var(--cor-texto); overflow-x: hidden; }
        .header { text-align: center; padding: 50px 20px; }
        .header h1 { font-family: 'Dancing Script', cursive; font-size: 3.5rem; color: var(--cor-destaque); margin: 0; }
        .varal-container { position: relative; padding: 40px 10px; min-height: 400px; }
        .corda { position: absolute; top: 60px; left: 0; width: 100%; height: 3px; background-color: #d2b48c; z-index: 1; }
        .mural { display: flex; flex-wrap: wrap; justify-content: center; gap: 30px; position: relative; z-index: 2; }
        .polaroid { background: white; padding: 15px 15px 35px 15px; box-shadow: 0 10px 20px rgba(0,0,0,0.1); border-radius: 2px; width: 250px; transition: transform 0.3s ease; position: relative; }
        .prendedor { width: 10px; height: 30px; background: #e0ac69; position: absolute; top: -15px; left: 50%; transform: translateX(-50%); border-radius: 2px; }
        .polaroid img { width: 100%; height: 250px; object-fit: cover; border: 1px solid #eee; }
        .legenda { font-family: 'Dancing Script', cursive; font-size: 1.4rem; text-align: center; margin-top: 15px; }
        .polaroid:nth-child(even) { transform: rotate(3deg); }
        .polaroid:nth-child(odd) { transform: rotate(-3deg); }
        .emoji-caindo { position: fixed; top: -50px; z-index: 0; user-select: none; pointer-events: none; animation: cair linear infinite; }
        @keyframes cair {
            0% { transform: translateY(0vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(105vh) rotate(360deg); opacity: 0; }
        }
        .footer { text-align: center; padding: 40px; opacity: 0.7; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useEffect } = React;

        const App = () => {
            const fotos = [
                { id: 1, url: './fotos/foto1.jpeg', legenda: 'Amor que não se mede' },
                { id: 2, url: './fotos/foto2.jpeg', legenda: 'Nossos melhores momentos' },
                { id: 3, url: './fotos/foto3.jpeg', legenda: 'Exemplo de vida' },
                { id: 4, url: './fotos/foto4.jpeg', legenda: 'Minha rainha' },
                { id: 5, url: './fotos/foto5.jpeg', legenda: 'Sempre juntos' },
                { id: 6, url: './fotos/foto6.jpeg', legenda: 'Feliz Dia das Mães!' },
            ];

            useEffect(() => {
                const emojis = ['❤️', '💖', '💐', '✨', '🌹'];
                const interval = setInterval(() => {
                    const emojiEl = document.createElement('div');
                    emojiEl.classList.add('emoji-caindo');
                    emojiEl.innerText = emojis[Math.floor(Math.random() * emojis.length)];
                    emojiEl.style.left = Math.random() * 100 + 'vw';
                    emojiEl.style.fontSize = Math.random() * 20 + 15 + 'px';
                    const duracao = Math.random() * 3 + 2;
                    emojiEl.style.animationDuration = duracao + 's';
                    document.body.appendChild(emojiEl);
                    setTimeout(() => emojiEl.remove(), duracao * 1000);
                }, 300);
                return () => clearInterval(interval);
            }, []);

            return (
                <div className="container-geral">
                    <header className="header">
                        <h1>Homenagem Dia das Mães</h1>
                        <p>Um pequeno gesto para quem nos deu tudo.</p>
                    </header>
                    <main className="varal-container">
                        <div className="corda"></div>
                        <div className="mural">
                            {fotos.map(foto => (
                                <div key={foto.id} className="polaroid">
                                    <div className="prendedor"></div>
                                    <img src={foto.url} alt={foto.legenda} />
                                    <p className="legenda">{foto.legenda}</p>
                                </div>
                            ))}
                        </div>
                    </main>
                    <footer className="footer">
                        <p>Feito com ❤️ para Patrícia Camila de Oliveira Rocha</p>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
